# 放到 dsh-Go 仓库的 .github/workflows/sync-check.yml（只放 main）
#
# 作用：每天（和手动触发时）做两件事
#   1. 把 Epsilon-MOD rebase 到 upstream/main，冲突就红叉并打印冲突文件
#   2. rebase 干净就编一次 arm64 release APK，证明改动还能出包
#
# 为什么 workflow 放 main 而不是工作分支：GitHub 只从默认分支注册 workflow，
# workflow_dispatch（手动按钮）和 schedule（定时）也只认默认分支。放 main 还让
# 调度逻辑和干活代码解耦——工作分支上就算某次提交把 yml 改坏了，定时任务照样能跑。
#
# fork 场景的两处必须：ref 写 Epsilon-MOD；基准用 upstream/main 而不是 origin/main。
# fork 里 origin 指向自己的仓库，main 只是 fork 那一刻的快照，永不同步，拿它当
# rebase 基准等于自己 rebase 自己，永远 Already up to date。

name: Sync & Build

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00，挑你睡觉的时候跑
    - cron: '0 19 * * *'
  workflow_dispatch:      # 也可以在 Actions 页面点按钮手动跑
    inputs:
      native_term:
        description: 'S1 原生终端探针：true 才加 --dart-define=DSH_NATIVE_TERM=true'
        required: false
        default: 'false'
      base:
        description: 'rebase 基准。默认 upstream/main（跟上游走）；填 origin/main 就是拿本仓库 main 当基准，不再追上游'
        required: false
        default: 'upstream/main'

concurrency:
  group: sync-check
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 运行时（rootfs + proot 等）不放在 git 里（runtime/.gitignore 排除了 out/）。
  # 官方 release APK 的 assets 里装的就是这份运行时，版本和当前源码一致：
  #   r15-dsh0.2.2-rc.1-node24.22.1-ubuntu24.04.5
  # 直接抽出来比在 CI 里跑 runtime/build-runtime.sh 快 20 分钟，而且字节级等同官方包。
  UPSTREAM_APK_TAG: v1.1.0

jobs:
  # ─────────────────────────────────────────────────────────────
  rebase:
    name: rebase 到 main
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.info.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Epsilon-MOD         # 你的工作分支
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: 记录 main 当前 HEAD
        id: info
        run: |
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git 2>/dev/null || true
          git fetch --no-tags upstream main   # 全量：浅历史下 merge-base 会落在浅边界，给出假绿
          BASE=$(git rev-parse --short upstream/main)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "main 当前 HEAD: \`$BASE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 试 rebase
        run: |
          set +e
          # 工作流目录的 modify/delete 冲突是预期内的：上游那套 ci/goldens/pr-gate
          # 我们已经全删了，上游还在改它们。规则固定为「保持删除」，其余冲突一律算真冲突。
          resolved=0
          # base=none：完全不 rebase，直接用分支原样构建。
          # 脱离上游之后就走这个，或者临时用来确认"问题出在代码还是出在重放"。
          if [ "${{ github.event.inputs.base || 'upstream/main' }}" = "none" ]; then
            echo "base=none：跳过 rebase" >> "$GITHUB_STEP_SUMMARY"
            rc=0
          else
            git rebase "${{ github.event.inputs.base || 'upstream/main' }}"
            rc=$?
          fi
          while [ "$rc" -ne 0 ] && [ "$resolved" -lt 80 ]; do
            conflicted=$(git diff --name-only --diff-filter=U 2>/dev/null)
            [ -n "$conflicted" ] || break
            if printf '%s\n' "$conflicted" | grep -qv '^\.github/workflows/'; then
              break
            fi
            resolved=$((resolved + 1))
            printf '%s\n' "$conflicted" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              git rm -q -f --ignore-unmatch -- "$f"
            done
            GIT_EDITOR=true git rebase --continue
            rc=$?
          done

          if [ "$rc" -ne 0 ]; then
            {
              echo "### ⚠️ 与上游冲突，需要人工介入"
              echo ""
              echo "\`\`\`"
              git status --short
              echo ""
              echo "冲突文件："
              git diff --name-only --diff-filter=U
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort
            echo "::error::rebase 到 upstream/main 冲突，见上方的冲突文件列表"
            exit 1
          fi
          echo "### ✅ 干净 rebase 到 upstream/main（自动保持删除的 workflow 冲突：$resolved 次）" >> "$GITHUB_STEP_SUMMARY"

      - name: 统计我们改了多少
        if: success()
        run: |
          {
            echo ""
            echo "### 相对上游的改动面"
            echo ""
            echo "\`\`\`"
            echo "文件数: $(git diff --name-only upstream/main...HEAD | wc -l)"
            git diff --stat upstream/main...HEAD | tail -20
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  build:
    name: 编 arm64 release
    needs: rebase
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Epsilon-MOD
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable        # pubspec 要求 Dart ^3.13.5；稳定版满足即可
          cache: true

      - name: 环境自检
        working-directory: app
        run: |
          flutter --version
          java -version

      - name: 取依赖
        working-directory: app
        run: flutter pub get

      # The workstation this fork is developed on has no full Flutter SDK, so
      # `flutter analyze` barely runs locally. This step is the only thing that
      # type-checks a patch before it becomes an APK. It runs before the build
      # so a broken patch costs a minute, not a full compile.
      - name: 静态分析
        working-directory: app
        run: |
          # Infos and warnings are not fatal: upstream main already has its own
          # and gating on them would turn this job red for code we never
          # touched. Errors are fatal, which is exactly what a patch needs.
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== 静态分析失败，报错明细见上 ==="
            exit "$status"
          fi

      # gradle 把 flavor 的 assets/jniLibs 直接从 runtime/out 打进包，那个目录被
      # gitignore（大文件，可重建），release 构建没有它就是一张空壳包。
      - name: 恢复运行时缓存
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            runtime/out
            runtime/out-tawcroot
          key: runtime-${{ env.UPSTREAM_APK_TAG }}-${{ hashFiles('runtime/tawcroot/source.json') }}-v1

      - name: 准备运行时
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "从官方 $UPSTREAM_APK_TAG 的 release APK 抽取运行时"
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/upstream.apk \
            "https://github.com/ccch1mneyyy/dsh-Go/releases/download/$UPSTREAM_APK_TAG/dsh-go-${UPSTREAM_APK_TAG#v}-arm64.apk"

          # 布局对齐 build.gradle.kts 的 sourceSets：
          #   arm64 → assets.srcDir(runtime/out/arm64-v8a/assets)
          #           jniLibs.srcDir(runtime/out/arm64-v8a/jniLibs)
          #   main  → jniLibs.srcDir(runtime/out-tawcroot/jniLibs)
          # APK 里因此是 assets/runtime/* 与 lib/arm64-v8a/lib*.so。
          python3 - <<'PY'
          import json, pathlib, sys, zipfile

          apk = zipfile.ZipFile("/tmp/upstream.apk")
          names = apk.namelist()
          need_jni = ["libproot.so", "libproot-loader.so", "libtalloc.so", "libandroid-shmem.so"]

          assets = pathlib.Path("runtime/out/arm64-v8a/assets")
          jni = pathlib.Path("runtime/out/arm64-v8a/jniLibs/arm64-v8a")
          tawc = pathlib.Path("runtime/out-tawcroot/jniLibs/arm64-v8a")
          for d in (assets, jni, tawc):
              d.mkdir(parents=True, exist_ok=True)

          def pull(member, dest):
              dest.parent.mkdir(parents=True, exist_ok=True)
              with apk.open(member) as src, open(dest, "wb") as out:
                  out.write(src.read())
              print(f"  {apk.getinfo(member).file_size:>11}  {dest}")

          runtime_members = [n for n in names if n.startswith("assets/runtime/")]
          if not any(n.endswith("/manifest.json") for n in runtime_members):
              sys.exit("APK 里没有 assets/runtime/manifest.json——上游打包布局变了，改用 runtime/build-runtime.sh")
          for member in runtime_members:
              pull(member, assets / member[len("assets/"):])

          for lib in need_jni:
              member = f"lib/arm64-v8a/{lib}"
              if member not in names:
                  sys.exit(f"APK 里没有 {member}")
              pull(member, jni / lib)

          # 可选的 tawcroot 启动方式；缺了 app 只是把那项标为不可用。
          member = "lib/arm64-v8a/libtawcroot.so"
          if member in names:
              pull(member, tawc / "libtawcroot.so")

          manifest = json.loads((assets / "runtime/manifest.json").read_text())
          print(f"运行时版本: {manifest['runtimeVersion']}")
          PY

      - name: 校验运行时
        run: python3 -I tooling/check_runtime_bundle.py arm64

      - name: 构建
        working-directory: app
        run: |
          set -euo pipefail
          # 版本名取自 pubspec，版本号取构建分钟（tooling/build_number.py 的编码），
          # 保证比手机上装的那个大，才能覆盖安装。pubspec 里的 `+1` 只是占位。
          name=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          code=$(python3 ../tooling/build_number.py)
          echo "构建 $name ($code)" | tee -a "$GITHUB_STEP_SUMMARY"

          # flavor 是必须的：这个工程按 ABI 定义了 arm64 / x64 两个 productFlavor。
          # 不带 --flavor 时 Gradle 会把两个 flavor 全编一遍（跑两轮 tree-shake、
          # 两倍时间），而 flutter 的产物拷贝只认 app-<flavor>-release.apk，
          # 于是编完了也说 "Gradle build failed to produce an .apk file"。
          # S1 探针开关。默认空串 = 正常包；Dart 侧读的是编译期常量
          # bool.fromEnvironment('DSH_NATIVE_TERM')，不给就是 false。
          native=""
          if [ "${{ inputs.native_term }}" = "true" ]; then
            native="--dart-define=DSH_NATIVE_TERM=true"
            echo "**S1 探针已启用**：终端页会换成原生 Termux 视图" >> "$GITHUB_STEP_SUMMARY"
          fi

          flutter build apk \
            --release \
            --flavor arm64 \
            --target-platform android-arm64 \
            --build-name "$name" \
            --build-number "$code" \
            --dart-define=DSH_APP_VERSION="$name+$code" \
            --dart-define=CI_BUILD=1 \
            $native \
            --android-skip-build-dependency-validation

      - name: 校验产物
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          test -f "$apk"
          size=$(stat -c %s "$apk")
          # Print the identity of what was built: the coexistence work turns on
          # getting this exactly right, and a silent drift here is invisible.
          aapt2=$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump badging "$apk" | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK: $apk ($size 字节)" | tee -a "$GITHUB_STEP_SUMMARY"
          # 带 rootfs 的包不可能小；这条防的是"编出来的空壳包"再次混过去。
          if [ "$size" -lt 150000000 ]; then
            echo "::error::$apk 只有 $size 字节，明显没带运行时"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-${{ needs.rebase.outputs.base }}
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          retention-days: 14
          if-no-files-found: error
