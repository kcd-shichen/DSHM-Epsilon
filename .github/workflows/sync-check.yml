# 放到 dsh-Go 仓库的 .github/workflows/sync-check.yml
#
# 作用：每天（和手动触发时）做两件事
#   1. 把 mod 分支 rebase 到 upstream/main，冲突就红叉并打印冲突文件
#   2. rebase 干净就顺手编一次 arm64 release APK，证明改动还能出包
#
# 为什么这么设计：分叉的维护成本几乎全部来自"上游改了，我不知道"。
# 这个 workflow 把"不知道"变成"每天早上邮件里告诉你改了哪几行"。

name: Sync & Build

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00，挑你睡觉的时候跑
    - cron: '0 19 * * *'
  workflow_dispatch:      # 也可以在 Actions 页面点按钮手动跑

concurrency:
  group: sync-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  rebase:
    name: rebase 到 main
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.info.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Epsilon-MOD         # 你的工作分支
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: 记录 main 当前 HEAD
        id: info
        run: |
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git 2>/dev/null || true
          git fetch --depth=200 upstream main
          BASE=$(git rev-parse --short upstream/main)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "main 当前 HEAD: \`$BASE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 试 rebase
        run: |
          set +e
          git rebase upstream/main
          rc=$?
          if [ "$rc" -ne 0 ]; then
            {
              echo "### ⚠️ 与上游冲突，需要人工介入"
              echo ""
              echo "\`\`\`"
              git status --short
              echo ""
              echo "冲突文件："
              git diff --name-only --diff-filter=U
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort
            echo "::error::rebase 到 upstream/main 冲突，见上方的冲突文件列表"
            exit 1
          fi
          echo "### ✅ 干净 rebase 到 upstream/main" >> "$GITHUB_STEP_SUMMARY"

      - name: 统计我们改了多少
        if: success()
        run: |
          {
            echo ""
            echo "### 相对上游的改动面"
            echo ""
            echo "\`\`\`"
            echo "文件数: $(git diff --name-only upstream/main...HEAD | wc -l)"
            git diff --stat upstream/main...HEAD | tail -20
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  build:
    name: 编 arm64 release
    needs: rebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Epsilon-MOD
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable        # pubspec 要求 Dart ^3.13.5；稳定版满足即可
          cache: true

      - name: 环境自检
        working-directory: app
        run: |
          flutter --version
          java -version

      - name: 取依赖
        working-directory: app
        run: flutter pub get

      # The workstation this fork is developed on has no Flutter SDK (the
      # container is aarch64 and Flutter ships no Linux arm64 host build), so
      # `flutter analyze` never runs locally. This step is the only thing that
      # type-checks a patch before it becomes an APK. It runs before the build
      # so a broken patch costs a minute, not a full compile.
      - name: 静态分析
        working-directory: app
        run: |
          # Infos and warnings are not fatal: upstream main already has its own
          # and gating on them would turn this job red for code we never
          # touched. Errors are fatal, which is exactly what a patch needs.
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== 静态分析失败，报错明细见上 ==="
            exit "$status"
          fi

      - name: 构建
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=CI_BUILD=1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-${{ needs.rebase.outputs.base }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error
