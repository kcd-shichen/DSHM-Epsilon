# 把 Epsilon-MOD rebase 到上游 main，并强推。
#
# 为什么不在本机做：这台机器拉不下 363 MB 的仓库（出口在 1 MB 处断流、
# codeload 不支持 Range），而 CI 那台手上有一份完整的。
#
# 跑完 Epsilon-MOD 的历史会被重写。推之前先有备份：
# 分支 `Epsilon-MOD-pre-sync` 指向同步前的头，回滚就把它 reset 回去。
#
# 和 sync-check.yml 的分工：
#   sync-upstream.yml  真的改分支（rebase + 强推）
#   sync-check.yml     只试不改（rebase 练习 + 构建）

name: Sync Upstream

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑 rebase 不推（true 时分支不动）"
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: rebase 到 upstream/main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Epsilon-MOD
          fetch-depth: 0        # 全量历史：浅历史下 merge-base 会落在浅边界，给出假绿

      - name: 配置 git
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: 记录同步前
        id: before
        run: |
          set -euo pipefail
          echo "old=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### 同步前"
            echo '```'
            echo "HEAD: $(git rev-parse --short HEAD)"
            echo "提交数: $(git rev-list --count HEAD)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 拉全量上游
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git
          git fetch --no-tags upstream main
          {
            echo ""
            echo "上游 main: \`$(git rev-parse --short upstream/main)\`（全量 fetch）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 同步面统计
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### 同步面"
            echo '```'
            echo "上游新增/修改的文件: $(git diff --name-only HEAD...upstream/main | wc -l)"
            echo "我们相对上游的改动:   $(git diff --name-only upstream/main...HEAD | wc -l)"
            echo ""
            echo "--- 我们改过、上游也改过的（冲突候选）---"
            comm -12 \
              <(git diff --name-only HEAD...upstream/main | sort) \
              <(git diff --name-only upstream/main...HEAD | sort) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: rebase
        run: |
          set +e
          git rebase upstream/main
          rc=$?
          if [ "$rc" -ne 0 ]; then
            {
              echo ""
              echo "### ⚠️ 冲突，需人工介入"
              echo '```'
              git status --short | head -40
              echo ""
              echo "冲突文件："
              git diff --name-only --diff-filter=U
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort
            echo "::error::rebase 到 upstream/main 冲突"
            exit 1
          fi
          {
            echo ""
            echo "### ✅ rebase 干净"
          } >> "$GITHUB_STEP_SUMMARY"

      # 不从上游接 runtime.yml：我们的运行时是从官方 release APK 里抽的
      # （比跑 runtime/build-runtime.sh 快 20 分钟且字节等同），这个 workflow 用不上。
      #
      # 而且它不是"可选"的：GITHUB_TOKEN 拿不到 workflows 权限（GitHub App 天生没有），
      # 只要这次推送在 .github/workflows/ 下引入任何改动，push 就会被
      # "refusing to allow a GitHub App to create or update workflow" 挡掉。
      # 删掉它，推送在 workflows 目录上的净变化就是零，一次解决两件事。
      - name: 丢掉上游的 runtime.yml
        run: |
          set -euo pipefail
          for f in .github/workflows/runtime.yml; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git rm -q "$f"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "sync: 不接上游的 runtime.yml（运行时从官方 APK 抽，不自己编）"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "已删除 \`.github/workflows/runtime.yml\`（避免 workflows 权限阻断）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 强推
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:Epsilon-MOD
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 已推送到 Epsilon-MOD" >> "$GITHUB_STEP_SUMMARY"

      - name: 同步后
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### 同步后"
            echo '```'
            git log --oneline -8
            echo ""
            echo "我们相对上游的改动文件数: $(git diff --name-only upstream/main...HEAD | wc -l)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
